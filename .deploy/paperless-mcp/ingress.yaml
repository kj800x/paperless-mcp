apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/instance: paperless-mcp
  annotations:
    external-dns.alpha.kubernetes.io/hostname: paperless-mcp.home.coolkev.com
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
  name: paperless-mcp
  namespace: kj800x
spec:
  ingressClassName: traefik
  rules:
    - host: paperless-mcp.home.coolkev.com
      http:
        paths:
          - backend:
              service:
                name: paperless-mcp
                port:
                  number: 80
            path: /
            pathType: Prefix
